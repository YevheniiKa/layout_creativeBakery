<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Creative bakery</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__wrapper">
        <img
          src="/src/images/icons/Logo.svg"
          alt="logo"
          class="header__logo"
        />
        <button
          class="header__burger-btn"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          <span class="header__burger-menu" />
        </button>
      </div>

      <nav
        id="mobile-menu"
        class="mobile-menu"
        aria-hidden="true"
      >
        <ul class="mobile-menu__list">
          <li class="menu-item">
            <a
              class="menu-link"
              href="#"
            >
              Products
            </a>
          </li>
          <li class="menu-item">
            <a
              class="menu-link"
              href="#"
            >
              About Us
            </a>
          </li>
          <li class="menu-item">
            <a
              class="menu-link"
              href="#"
            >
              Blog
            </a>
          </li>
          <li class="menu-item">
            <a
              class="menu-link menu-link-contact-us"
              href="#"
            >
              <button class="menu-link__btn">
                <span class="menu-link__icon" />
              </button>
              <span class="menu-link__text">Contact Us</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="main-content">
      <section class="hero-section">
        <span class="hero-section__text">
          We bake your fantasies — croissants, cakes, cookies, and cupcakes.
        </span>
      </section>
    </main>
    <script src="src/scripts/main.js"></script>
  </body>
</html>
